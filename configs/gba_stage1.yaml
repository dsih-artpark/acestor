pipeline:
  name: dengue
  # Used for report/map titles when report.document_title is omitted:
  title: "Dengue intelligence"

run:
  run_date: "2026-03-18"

# ---------------------------------------------------------------------------
# Data download & parse configuration
# ---------------------------------------------------------------------------
data:
  case_download:
    enabled: true
    source_backend: "filesystem"   # "filesystem" or "s3"
    source_path: "datasets/raw_linelist_data/Bengaluru_IHIP_linelist"

  case_parse:
    # Raw lat/lon inputs: list multiple types (e.g. corp + zone) like SOT ParseNonStandardizedCaseData.py loop.
    # Pre-aggregated inputs (region_id/date/case): use exactly one entry — file is already one resolution.
    region_types:
      - "zone"
    date_start: "2015-01-01"
    date_end: ""   # inclusive end; empty → use today

  geojson:
    base_path: "geojsons/geojsons_GBA"  # layout: {base_path}/{region_type}s/*.geojson

  # Early exit if sampled case data is too thin (cf. main.py can_run_predictions).
  case_sufficiency:
    enabled: true
    min_total_rows: 30
    min_distinct_regions: 2
    min_date_span_days: 14
    case_column: "case"
    region_column: ""   # empty → use location.admin*.ID from region_type
    date_column: ""     # empty → metadata.primaryDate

  weather_download:
    enabled: true
    source_mode: "filesystem"           # "filesystem" (local zip cache) or "cds" (download from Copernicus)
    netcdf_cache_path: "./datasets/netcdf"        # local zip cache dir; if set, filesystem mode parses zips here
    parsed_output_path: "./datasets/parsednetcdf" # parsed CSVs cached here; re-parse skipped if CSV already exists
    # region_bounds: [13.3, 77.3, 12.7, 77.9]  # [N, W, S, E] or omit for auto from geojson
    region_type: "zone"                       # zone, corp, ward
    w_params: ["t2m", "d2m", "tp"]            # NetCDF short variable names for parsing
    threshold_km: 25.0                        # grid-point distance filter from region boundary
    bounds_resolution_deg: 0.1                # auto bounds: snap to this degree grid + padding (~0.25 for ERA5 single-levels)
    start_date: "2015-01-01"                  # inclusive download start (YYYY-MM-DD)
    end_date: "2024-07-01"                    # inclusive download end (YYYY-MM-DD)
    # cds_variables:                          # optional: override CDS API variable names (default: from GBA_CDS_VARIABLES env)
    #   - "2m_temperature"
    #   - "2m_dewpoint_temperature"
    #   - "total_precipitation"

  weather_parse:
    region_type: "zone"
    weather_variables:
      - "2mTemperature"
      - "totalPrecipitation"
      - "2mDewpointTemperature"
    # Daily aggregation matches SOT: t2m → max/min/mean, d2m → mean, tp → sum.
    daily_agg:
      - name: "2mTemperature"
        op: "mean"
      - name: "2mTemperature"
        op: "max"
        output_name: "2mTemperature_max"
      - name: "2mTemperature"
        op: "min"
        output_name: "2mTemperature_min"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"

    # Rolling aggregation: mean for all temperature variants, sum for precipitation.
    rolling_agg:
      - name: "2mTemperature"
        op: "mean"
      - name: "2mTemperature_max"
        op: "mean"
      - name: "2mTemperature_min"
        op: "mean"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"
    # Number of days to aggregate over for rolling windows; default 7.
    rolling_n_days: 7
    # Sample rate for daily data; default 7.
    sampling_rate: 7
    # Column rename applied when writing agg_daily / agg_Ndays intermediate files (SOT names)
    intermediate_col_rename:
      "2mTemperature_max": "t2m_max"
      "2mTemperature_min": "t2m_min"
      "2mTemperature": "t2m_mean"
      "2mDewpointTemperature": "d2m_mean"
      "totalPrecipitation": "tp_sum"

# ---------------------------------------------------------------------------
# Cutoff, threshold, and model configuration
# ---------------------------------------------------------------------------
cutoff:
  case_min_regions: 10
  weather_min_regions: 25

thresholds:
  region_type: "zone"
  n_weeks: 4
  historical_n_years: 5
  excluded_years: [2020, 2021]

model:
  spatial_res: "zone"
  data_features:
    - "case"
    - "recordDate"
    - "recordYear"
    - "recordMonth"
    - "ISOWeek"
    - "t2m_mean"
    - "tp_sum"
    - "d2m_mean"
  lag:
    lag_temp: [12]
    lag_rf: [4]
  years_to_exclude: [2020, 2021]
  list_alpha: [1.0, 2.0]

# ---------------------------------------------------------------------------
# Post-processing
# ---------------------------------------------------------------------------
assess:
  total_corp_regions: 5
  total_zone_regions: 10

maps:
  output_dir: "plots"
  figure_title: "Dengue risk map"

report:
  output_dir: "reports"
  compile_pdf: false
  # Optional overrides (defaults come from pipeline.title + sensible fallbacks):
  # document_title: "Custom — summary report"
  # caption_corp_scope: "municipal corporations"
  # caption_zone_scope: "planning zones"
  # bundle_prefix: "Report"

# Runner notification (acestor.core.runner) — optional SMTP when enabled.
# email:
#   enabled: false
#   on: [success, failed]   # runner status strings
#   from: "pipeline-bot@example.com"
#   to: ["team@example.com"]
#   smtp:
#     host: "smtp.example.com"
#     port: 587
#     use_tls: true
#     username: "${SMTP_USER:-}"
#     password: "${SMTP_PASSWORD:-}"

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: INFO

# ---------------------------------------------------------------------------
# Storages
# ---------------------------------------------------------------------------
storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts"
