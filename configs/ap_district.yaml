pipeline:
  name: dengue
  title: "Dengue Early Warning System — Andhra Pradesh"

run:
  run_date: ""   # leave blank to use today's date

data:
  case_download:
    enabled: true
    source_backend: "filesystem"
    source_path: "ap_datasets/raw_linelist_data/AP_IHIP"

  case_parse:
    region_types:
      - "district"
    date_start: "2021-09-01"
    date_end: ""

  case_sufficiency:
    enabled: true
    min_total_rows: 30
    min_distinct_regions: 2
    min_date_span_days: 14

  geojson:
    base_path: "ap_datasets/geojsons/geojsons_AP"

  weather_download:
    enabled: true
    source_backend: "filesystem"
    source_path: "ap_datasets/parsednetcdf/district"   # pre-parsed CSVs from transform_ap_data.py
    region_type: "district"

  weather_parse:
    region_type: "district"
    weather_variables:
      - "2mTemperature"
      - "totalPrecipitation"
      - "2mDewpointTemperature"
    daily_agg:
      - {name: "2mTemperature",         op: "max",  output_name: "2mTemperature_max"}
      - {name: "2mTemperature",         op: "min",  output_name: "2mTemperature_min"}
      - {name: "2mTemperature",         op: "mean"}
      - {name: "2mDewpointTemperature", op: "mean"}
      - {name: "totalPrecipitation",    op: "sum"}
    rolling_n_days: 7
    rolling_agg:
      - {name: "2mTemperature",         op: "mean"}
      - {name: "2mDewpointTemperature", op: "mean"}
      - {name: "totalPrecipitation",    op: "sum"}
    sampling_rate: 7
    intermediate_col_rename:
      "2mTemperature_max": "t2m_max"
      "2mTemperature_min": "t2m_min"
      "2mTemperature": "t2m_mean"
      "2mDewpointTemperature": "d2m_mean"
      "totalPrecipitation": "tp_sum"

cutoff:
  case_min_regions: 2
  weather_min_regions: 5

thresholds:
  region_type: "district"
  n_weeks: 4
  historical_n_years: 4   # ERA5 data covers 2022–2026 (~4 years)
  excluded_years: []
  included_years: []

model:
  spatial_res: "district"
  data_features:
    - "case"
    - "recordDate"
    - "recordYear"
    - "recordMonth"
    - "ISOWeek"
    - "t2m_mean"
    - "tp_sum"
    - "d2m_mean"
  lag:
    lag_temp: [12]
    lag_rf: [4]
  years_to_exclude: []
  years_to_include: []
  list_alpha: [1.0, 2.0]

assess:
  total_district_regions: 26   # AP has 26 districts (post-2022 reorganisation)

maps:
  output_dir: "plots"
  figure_title: "Andhra Pradesh Dengue Risk Map"

report:
  output_dir: "reports"
  compile_pdf: true
  caption_primary: "AP districts"
  caption_secondary: ""

report_distribution:
  system_name: "Dengue Early Warning System"
  organization: "ARTPARK, IISc Bengaluru"
  state: "Andhra Pradesh"
  region: "Andhra Pradesh (26 Districts)"
  department: "Directorate of Public Health & Family Welfare, GoAP"
  contact_email: ""
  footer_note: ""

logging:
  level: INFO

email:
  enabled: false

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/ap"
