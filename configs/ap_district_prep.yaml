pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Andhra Pradesh"

run:
  run_date: ""

data:
  region_type: "district"

  date_range:
    start: "2021-09-01"
    # end: "2026-04-10"
    # end: ""   # leave blank → defaults to today's date

  geojson:
    base_path: "ap_datasets/geojsons/geojsons_AP"

  case_download:
    enabled: true
    source_path: "ap_datasets/raw_case"   # path to folder containing IHIP files (.xlsx/.xls/.csv)

  case_parse:
    region_types:
      - "district"
    date_column: "Sample Collected Date"          # column in IHIP file to use as case date
    lgd_code_column: "District Code"              # if present, use LGD code lookup (skips spatial join)
                                                  # remove/comment out to use lat/lon spatial join instead
    lat_column: "Latitude"  # Default "Latitude"  # latitude column for spatial join fallback
    lon_column: "Longitude" # Defailt "Longitude" # longitude column for spatial join fallback
    filters:                                        # AND across entries, OR within each values list
      - column: "Confirmed Diagnosis"
        values: ["Dengue"]

  weather_download:
    enabled: true
    source_mode: "openmeteo"     # openmeteo | filesystem | ap_state_api | /path/to/custom.py
    parsed_output_path: "datasets/ap-weather"
    temperature_unit: "celsius"  # unit the source returns: "celsius" | "kelvin"
    precipitation_unit: "mm"     # unit the source returns: "mm" | "m"
    # source_path: "datasets/ap-weather"  # required when source_mode=filesystem

logging:
  level: DEBUG

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/ap_prep"
