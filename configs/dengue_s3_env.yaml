pipeline:
  name: dengue
  title: "Dengue intelligence"

run:
  # Keep empty to use current date semantics in steps that support it.
  run_date: ""

# ---------------------------------------------------------------------------
# Data download & parse configuration
# ---------------------------------------------------------------------------
data:
  case_download:
    enabled: true
    source_storage: "raw_case"
    # Object keys under raw_case storage base_prefix (or bucket root if empty).
    source_paths:
      - "${CASE_SOURCE_KEY:-cases_zone_daily.csv}"
    dest_relpath: "datasets/raw_case_data"

  case_parse:
    region_types:
      - "zone"
    date_start: "${CASE_DATE_START:-2015-01-01}"
    date_end: "${CASE_DATE_END:-}"

  case_sufficiency:
    enabled: true
    min_total_rows: 30
    min_distinct_regions: 2
    min_date_span_days: 14
    case_column: "case"
    region_column: ""
    date_column: ""

  weather_download:
    enabled: true
    source_mode: "filesystem" # Uses source_storage below; backend can be s3 or filesystem.
    source_storage: "raw_weather"
    source_prefix: "${WEATHER_SOURCE_PREFIX:-}"
    source_paths: []
    dest_relpath: "datasets/raw_weather_data"

    region_type: "zone"
    w_params: ["t2m", "d2m", "tp"]
    threshold_km: 25.0
    bounds_resolution_deg: 0.1
    start_date: "${WEATHER_DATE_START:-2015-01-01}"
    end_date: "${WEATHER_DATE_END:-}"

  weather_parse:
    region_type: "zone"
    weather_variables: ["2mTemperature", "totalPrecipitation", "2mDewpointTemperature"]
    daily_agg:
      - { name: "2mTemperature", op: "mean" }
      - { name: "2mDewpointTemperature", op: "mean" }
      - { name: "totalPrecipitation", op: "sum" }
    rolling_agg:
      - { name: "2mTemperature", op: "mean" }
      - { name: "2mDewpointTemperature", op: "mean" }
      - { name: "totalPrecipitation", op: "sum" }
    rolling_n_days: 7
    sampling_rate: 7

cutoff:
  case_min_regions: 2
  weather_min_regions: 5

thresholds:
  region_type: "zone"
  n_weeks: 4
  historical_n_years: 5
  excluded_years: [2020, 2021]

model:
  spatial_res: "zone"
  tempo_res: "W-MON"
  data_features:
    - "case"
    - "recordDate"
    - "recordYear"
    - "recordMonth"
    - "ISOWeek"
    - "2mTemperature"
    - "totalPrecipitation"
    - "2mDewpointTemperature"
  lag:
    lag_temp: [12]
    lag_rf: [4]
  years_to_exclude: [2020, 2021]
  list_alpha: [1.0, 2.0]

assess:
  total_corp_regions: 5
  total_zone_regions: 10

maps:
  output_dir: "plots"
  figure_title: "Dengue risk map"

report:
  output_dir: "reports"
  compile_pdf: false
  # Optional:
  # document_title: "Dengue intelligence — summary report"
  # caption_corp_scope: "municipal corporations"
  # caption_zone_scope: "planning zones"
  # bundle_prefix: "Report"

email:
  enabled: false
  on: [success, failed]
  from: "${EMAIL_FROM:-pipeline-bot@example.com}"
  to: ["${EMAIL_TO:-team@example.com}"]
  smtp:
    host: "${SMTP_HOST:-}"
    port: "${SMTP_PORT:-587}"
    use_tls: true
    username: "${SMTP_USER:-}"
    password: "${SMTP_PASSWORD:-}"

logging:
  level: INFO

# ---------------------------------------------------------------------------
# Storages (S3-backed)
# ---------------------------------------------------------------------------
storages:
  raw_case:
    kind: s3
    s3:
      bucket: "${RAW_CASE_BUCKET}"
      base_prefix: "${RAW_CASE_PREFIX:-}"
      aws_profile: "${AWS_PROFILE:-}"
      region: "${AWS_REGION:-}"

  raw_weather:
    kind: s3
    s3:
      bucket: "${RAW_WEATHER_BUCKET}"
      base_prefix: "${RAW_WEATHER_PREFIX:-}"
      aws_profile: "${AWS_PROFILE:-}"
      region: "${AWS_REGION:-}"

  artifacts:
    kind: s3
    s3:
      bucket: "${ARTIFACTS_BUCKET}"
      base_prefix: "${ARTIFACTS_PREFIX:-acestor/runs}"
      aws_profile: "${AWS_PROFILE:-}"
      region: "${AWS_REGION:-}"

  # Optional run metadata sink ({run_id}/run.json)
  runs:
    kind: s3
    s3:
      bucket: "${RUNS_BUCKET}"
      base_prefix: "${RUNS_PREFIX:-acestor/runs-meta}"
      aws_profile: "${AWS_PROFILE:-}"
      region: "${AWS_REGION:-}"

