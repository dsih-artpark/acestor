pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Odisha (district)"

run:
  run_date: ""

data:
  region_type: "district"

  prepared_data:
    base_dir: "od_datasets/prepared_data"

  date_range:
    start: "2016-01-01"

  geojson:
    base_path: "od_datasets/geojsons/geojsons_OD"
    source_mode: dashboard
    scope_id: odisha
    refresh: false

  case_download:
    enabled: true
    source_mode: dashboard
    source_path: "od_datasets/raw_case"
    date_start: "2021-01-01"
    selected_region_id: "odisha"
    backfill_days: 30
    disease: "Dengue"

  case_parse:
    region_types:
      - "district"
    date_column: ["Date Of Onset", "Test Performed Date", "Sample Collected Date"]
    region_id_column: "Region Id"
    filters:
      - column: "Test Suspected For"
        values: ["Dengue"]

  weather_download:
    enabled: true
    source_mode: dashboard
    scope_id: "odisha"    # try lowercase first; dashboard weather-endpoint quirk may require "Odisha"
    parsed_output_path: "od_datasets/weather"
    temperature_unit: "celsius"    # openmeteo returns °C — parser converts to K on disk
    precipitation_unit: "mm"       # openmeteo returns mm — parser converts to m on disk

logging:
  level: DEBUG

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/od_prep"
