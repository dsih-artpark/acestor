state: "OD"

pipeline:
  name: dengue_downscale
  title: "Dengue Downscale — Odisha District → ULB"

run:
  source_run_id: "latest"

downscale:
  parent_level: district
  child_level: ulb
  window_weeks: 4
  cases_csv: "od_datasets/prepared_data/ulb/cases_daily.csv"
  geojson_base_path: "od_datasets/geojsons/geojsons_OD"

thresholds:
  region_type: ulb
  list_alpha: [1.0, 2.0]
  classification_method: percentile
  methods: [historical, prev_nweeks]
  method_configs:
    prev_nweeks:
      n_weeks: 4
    historical:
      historical_n_years: 4
      excluded_years: []
      included_years: []

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "artifacts/od"

logging:
  level: INFO
