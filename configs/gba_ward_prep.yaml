pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Greater Bengaluru Authority (ward)"

run:
  run_date: ""

data:
  region_type: "ward"

  prepared_data:
    base_dir: "gba_datasets/prepared_data"

  date_range:
    start: "2024-01-01"

  geojson:
    base_path: "gba_datasets/geojsons/geojsons_GBA"
    # Wards live under <base>/ward/ or <base>/wards/. The geocoding resolver
    # auto-detects either layout.

  case_download:
    enabled: true
    source_path: "gba_datasets/raw_case"

  case_parse:
    region_types:
      - "ward"
    date_column: "Sample Collected Date"
    header_row: 1   # BBMP weekly exports have a banner / title row at row 0
    # No LGD code column for BBMP wards in IHIP data — use geocoding instead.
    # If a future file has lat/lon directly, the spatial-join fallback would
    # kick in automatically; for now the IHIP files only carry Patient Address.
    geocoding:
      enabled: true
      address_column: "Patient Address"
      context_columns:
        - "Village Or Ward"   # most-specific source token (e.g. "Ward No.21(Hebbala)" → "hebbala")
        - "Sub District"      # mid-specific (e.g. "Bengaluru North" → "north")
        - "Ulb"               # broad, mostly stopworded ("Greater Bengaluru Authority")
      cache_file: "cache/gba_geocode_cache.json"
      # require_address: true   (default) — drop rows with no Patient Address
      # require_validation: true (default) — drop rows where geocode didn't
      # validate or didn't land in any ward polygon. Flip to false to keep
      # them in cases_daily.csv with NaN region_id (partial-aggregation use).
    filters:
      - column: "Confirmed Diagnosis"
        values: ["Dengue"]

  weather_download:
    enabled: false   # set to true + configure source when GBA weather is ready

logging:
  level: INFO

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/gba_prep"
