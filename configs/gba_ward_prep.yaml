pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Greater Bengaluru Authority (ward)"

run:
  run_date: ""

data:
  region_type: "ward"

  prepared_data:
    base_dir: "gba_datasets/prepared_data"

  date_range:
    start: "2024-01-01"

  geojson:
    base_path: "gba_datasets/geojsons/geojsons_GBA"
    # Wards live under <base>/ward/ or <base>/wards/. The geocoding resolver
    # auto-detects either layout.

  case_download:
    enabled: true
    source_path: "gba_datasets/raw_case"

  case_parse:
    region_types:
      - "ward"
    date_column: "Sample Collected Date"
    header_row: 1   # BBMP weekly exports have a banner / title row at row 0
    # No LGD code column for BBMP wards in IHIP data — use geocoding instead.
    # If a future file has lat/lon directly, the spatial-join fallback would
    # kick in automatically; for now the IHIP files only carry Patient Address.
    geocoding:
      enabled: true
      address_fields:
        # Primary composition — joined as "v1, v2, v3, v4".
        # First field is also the "primary identifier" for require_address.
        - "Patient Address"   # specific but can be cross-state (e.g. Jhansi, UP)
        - "Village Or Ward"   # specific area token (e.g. "Ward No.21(Hebbala)")
        - "Sub District"      # e.g. "Bengaluru North"
        - "Ulb"               # "Greater Bengaluru Authority" — broad, mostly stopworded
      fallback_address_fields:
        # Tried only for rows that didn't produce a usable ward on the primary
        # composition. Facility names are well-known to Google AND always in
        # BBMP, so this recovers cross-state-patient cases like the Jhansi one.
        - "Facility Name Lform"
        - "Village Or Ward"
        - "Sub District"
        - "Ulb"
      cache_file: "cache/gba_geocode_cache.json"
      # Viewport-bias Google toward Greater Bengaluru. Soft only — pairs
      # with restrict_admin_area_tokens (below) to hard-reject anything
      # that still lands outside Karnataka (e.g. cross-state Patient
      # Addresses like "jhansi, uttar pradesh").
      # [min_lat, min_lon, max_lat, max_lon]
      bounds: [12.7, 77.3, 13.3, 77.9]
      restrict_admin_area_tokens:
        - "Karnataka"
      # require_address: true   (default) — drop rows where the first
      #                                     address_field column is empty.
      # require_validation: true (default) — drop rows where BOTH passes
      #                                     failed (no ward attached).
    filters:
      - column: "Confirmed Diagnosis"
        values: ["Dengue"]

  weather_download:
    enabled: false   # set to true + configure source when GBA weather is ready

logging:
  level: INFO

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/gba_prep"
