state: "OD"

pipeline:
  name: dengue_downscale
  title: "Dengue Downscale — Odisha ULB → ULB Ward"

run:
  # Points at the latest downscale-to-ULB run (od_district_to_ulb output),
  # which is what supplies the ULB-level parent predictions for this
  # downscale to bring to ward level.
  source_run_id: "latest"

data:
  geojson:
    base_path: "od_datasets/geojsons/geojsons_OD"
  prepared_data:
    base_dir: "od_datasets/prepared_data"

downscale:
  parent_level: ulb
  child_level: ulb_ward
  window_weeks: 4
  cases_csv: "od_datasets/prepared_data/ulb_ward/cases_daily.csv"
  geojson_base_path: "od_datasets/geojsons/geojsons_OD"

thresholds:
  region_type: ulb_ward
  list_alpha: [1.0, 2.0]
  classification_method: percentile
  methods: [historical, prev_nweeks]
  method_configs:
    prev_nweeks:
      n_weeks: 4
    historical:
      historical_n_years: 4
      excluded_years: []
      included_years: []

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "artifacts/od"

logging:
  level: INFO
