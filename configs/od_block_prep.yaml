pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Odisha (block, cases only)"

run:
  run_date: ""

data:
  region_type: "block"

  prepared_data:
    base_dir: "od_datasets/prepared_data"

  date_range:
    start: "2016-01-01"

  geojson:
    base_path: "od_datasets/geojsons/geojsons_OD"
    source_mode: dashboard
    scope_id: odisha
    refresh: false

  case_download:
    enabled: true
    source_mode: dashboard
    date_start: "2021-01-01"
    selected_region_id: "odisha"
    backfill_days: 30
    disease: "Dengue"
    source_path: "od_datasets/raw_case"

  case_parse:
    region_types:
      - "block"
    date_column: ["Date Of Onset", "Test Performed Date", "Sample Collected Date"]
    region_id_column: "Region Id"    # dashboard export carries resolved region_id
    lat_column: "Latitude"
    lon_column: "Longitude"
    filters:
      - column: "Test Suspected For"
        values: ["Dengue"]

  weather_download:
    enabled: false   # no block-level weather; downscale uses parent (district) weather

logging:
  level: DEBUG

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/od_block_prep"
