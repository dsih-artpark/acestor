state: "GBA"

pipeline:
  name: dengue_downscale
  title: "Dengue Downscale — GBA Zone → Ward"

run:
  source_run_id: "latest"

data:
  prepared_data:
    base_dir: "gba_datasets/prepared_data"

downscale:
  parent_level: zone
  child_level: ward
  window_weeks: 4
  cases_csv: "gba_datasets/prepared_data/ward/cases_daily.csv"
  geojson_base_path: "gba_datasets/geojsons/geojsons_GBA"

thresholds:
  region_type: ward
  list_alpha: [1.0, 2.0]
  classification_method: percentile
  # Per-region historical percentile cutoffs (issue #62): the current week's
  # forecast is placed in one of 4 bands relative to the region's own history.
  # Cutoffs 50/75/90 → 4 bands: ≤p50, (p50,p75], (p75,p90], >p90.
  percentile_cutoffs: [50.0, 75.0, 90.0]
  methods: [historical, prev_nweeks, weighted_baseline]
  method_configs:
    prev_nweeks:
      n_weeks: 4
    historical:
      historical_n_years: 4
      excluded_years: []
      included_years: []

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "artifacts/gba_zone"

logging:
  level: INFO
