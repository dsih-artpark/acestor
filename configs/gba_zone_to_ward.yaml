state: "GBA"

pipeline:
  name: dengue_downscale
  title: "Dengue Downscale — GBA Zone → Ward"

run:
  source_run_id: "latest"

data:
  geojson:
    base_path: "gba_datasets/geojsons/geojsons_GBA"
  prepared_data:
    base_dir: "gba_datasets/prepared_data"

downscale:
  parent_level: zone
  child_level: ward
  window_weeks: 4
  cases_csv: "gba_datasets/prepared_data/ward/cases_daily.csv"
  geojson_base_path: "gba_datasets/geojsons/geojsons_GBA"

thresholds:
  region_type: ward
  list_alpha: [1.0, 2.0]
  classification_method: percentile
  # Seasonal endemic channel: pool this ISO week ±2 weeks across 2022–2025.
  # W1–17 P75 range is 0–6; use a 1-case floor and 6-case critical cutoff.
  percentile_cutoffs: [50.0, 75.0, 90.0]
  percentile_week_pool: 2
  percentile_year_range: [2022, 2025]
  percentile_low_season_floor: 1.0
  percentile_low_season_critical: 6.0
  methods: [historical, prev_nweeks, weighted_baseline]
  method_configs:
    prev_nweeks:
      n_weeks: 4
    historical:
      historical_n_years: 4
      excluded_years: []
      included_years: []

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "artifacts/gba_zone"

logging:
  level: INFO
