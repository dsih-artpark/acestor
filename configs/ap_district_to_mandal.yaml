pipeline:
  name: dengue_downscale
  title: "Dengue Downscale — AP District → Mandal"

run:
  # Run ID of the dengue pipeline run whose predictions to disaggregate.
  # Use "latest" to automatically pick the most recent run under artifacts/ap/.
  source_run_id: "latest"

downscale:
  parent_level: district    # singular — matches region_type convention
  child_level: mandal       # singular — matches region_type convention
  window_weeks: 4           # how many recent weeks of cases to use for share computation
  cases_csv: "prepared_data/mandal/cases_daily.csv"  # child-level daily case counts
  geojson_base_path: "ap_datasets/geojsons/geojsons_AP"

# Child (mandal) risk-zone re-derivation. Mirror the parent dengue run's thresholds
# block so child zones use the SAME settings — each child is classified against its
# OWN history, never by inheriting the parent district's zone. Keep these in sync
# with the parent run config (ap_district_v3.yaml) until runs persist their config
# (see issue #40 for AP-supplied external thresholds).
thresholds:
  region_type: mandal
  list_alpha: [1.0, 2.0]             # risk zone bands: T = Mean + alpha*StdDev
  classification_method: who          # who (default) | icmr
  methods: [historical, prev_nweeks, weighted_baseline]
  method_configs:
    prev_nweeks:
      n_weeks: 4
    historical:
      historical_n_years: 4
      excluded_years: []
      included_years: []

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "artifacts/ap"

logging:
  level: INFO
