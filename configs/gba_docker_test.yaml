pipeline:
  name: dengue
  title: "Dengue Intelligence"

run:
  run_date: "2026-03-18"

data:
  case_download:
    enabled: true
    source_backend: "filesystem"
    source_path: "datasets/raw_linelist_data/Bengaluru_IHIP_linelist"

  case_parse:
    region_types:
      - "zone"
    date_start: "2015-01-01"
    date_end: ""

  geojson:
    base_path: "datasets/geojsons/geojsons_GBA"

  case_sufficiency:
    enabled: true
    min_total_rows: 30
    min_distinct_regions: 2
    min_date_span_days: 14
    case_column: "case"
    region_column: ""
    date_column: ""

  weather_download:
    enabled: true
    source_mode: "filesystem"
    netcdf_cache_path: "./datasets/netcdf"
    parsed_output_path: "./datasets/parsednetcdf"
    region_type: "zone"
    w_params: ["t2m", "d2m", "tp"]
    threshold_km: 25.0
    bounds_resolution_deg: 0.1
    start_date: "2015-01-01"
    end_date: "2024-07-01"

  weather_parse:
    region_type: "zone"
    weather_variables:
      - "2mTemperature"
      - "totalPrecipitation"
      - "2mDewpointTemperature"
    daily_agg:
      - name: "2mTemperature"
        op: "mean"
      - name: "2mTemperature"
        op: "max"
        output_name: "2mTemperature_max"
      - name: "2mTemperature"
        op: "min"
        output_name: "2mTemperature_min"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"
    rolling_agg:
      - name: "2mTemperature"
        op: "mean"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"
    rolling_n_days: 7
    sampling_rate: 7
    intermediate_col_rename:
      "2mTemperature_max": "t2m_max"
      "2mTemperature_min": "t2m_min"
      "2mTemperature": "t2m_mean"
      "2mDewpointTemperature": "d2m_mean"
      "totalPrecipitation": "tp_sum"

cutoff:
  case_min_regions: 10
  weather_min_regions: 25

thresholds:
  region_type: "zone"
  n_weeks: 4
  historical_n_years: 5
  excluded_years: [2020, 2021]

model:
  spatial_res: "zone"
  data_features:
    - "case"
    - "recordDate"
    - "recordYear"
    - "recordMonth"
    - "ISOWeek"
    - "t2m_mean"
    - "tp_sum"
    - "d2m_mean"
  lag:
    lag_temp: [12]
    lag_rf: [4]
  years_to_exclude: [2020, 2021]
  list_alpha: [1.0, 2.0]

assess:
  total_corp_regions: 5
  total_zone_regions: 10

maps:
  output_dir: "plots"
  figure_title: "Dengue Risk Map"

report:
  output_dir: "reports"
  compile_pdf: false   # skip LaTeX for faster test runs

email:
  enabled: true
  "on": ["success"]
  from: "${SMTP_FROM}"
  to:
    - ashutosh.singhai@artpark.in
  smtp:
    host: "${SMTP_HOST}"
    port: 587
    use_tls: true
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"

report_distribution:
  system_name: "Dengue Early Warning System"
  organization: "ARTPARK, IISc Bengaluru"
  state: "Karnataka"
  region: "Greater Bengaluru Area (GBA)"
  department: "Directorate of Health & Family Welfare, GoK"

schedule:
  cron: "*/5 * * * *"   # every 5 minutes — for Docker test only
  timezone: "Asia/Kolkata"
  pipeline: "pipelines.dengue.pipeline:build_pipeline"
  config: "configs/gba_docker_test.yaml"

logging:
  level: INFO

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts"
