# Smoke config: raw lat/lon CSV + multiple region_types (spatial join + geojson each).
# Requires: nonstd_case_smoke.csv under raw_case storage base_path.
pipeline:
  name: dengue
  title: "Dengue intelligence"

run:
  run_date: "2026-03-18"

data:
  case_download:
    enabled: true
    source_storage: "raw_case"
    source_paths:
      - "nonstd_case_smoke.csv"
    dest_relpath: "datasets/raw_case_data"

  case_parse:
    region_types:
      - "corp"
      - "zone"   # last entry → sampled_csv_path for downstream (same as SOT loop order)
    date_start: "2015-01-01"
    date_end: ""

  case_sufficiency:
    enabled: true
    min_total_rows: 1
    min_distinct_regions: 1
    min_date_span_days: 1
    case_column: "case"
    region_column: ""
    date_column: ""

  weather_download:
    enabled: true
    source_mode: "filesystem"
    source_storage: "raw_weather"
    source_prefix: ""
    source_paths: []
    dest_relpath: "datasets/raw_weather_data"
    region_type: "zone"
    w_params: ["t2m", "d2m", "tp"]
    threshold_km: 25.0
    bounds_resolution_deg: 0.1
    start_date: "2015-01-01"
    end_date: "2024-07-01"

  weather_parse:
    region_type: "zone"
    weather_variables:
      - "2mTemperature"
      - "totalPrecipitation"
      - "2mDewpointTemperature"
    daily_agg:
      - name: "2mTemperature"
        op: "mean"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"

    rolling_agg:
      - name: "2mTemperature"
        op: "mean"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"
    # Number of days to aggregate over for rolling windows; default 7.
    rolling_n_days: 7
    # Sample rate for daily data; default 7.
    sampling_rate: 7

cutoff:
  case_min_regions: 2
  weather_min_regions: 5

thresholds:
  region_type: "zone"
  n_weeks: 4
  historical_n_years: 5
  excluded_years: [2020, 2021]

model:
  spatial_res: "zone"
  tempo_res: "W-MON"
  data_features:
    - "case"
    - "recordDate"
    - "recordYear"
    - "recordMonth"
    - "ISOWeek"
    - "2mTemperature"
    - "totalPrecipitation"
    - "2mDewpointTemperature"
  lag:
    lag_temp: [12]
    lag_rf: [4]
  years_to_exclude: [2020, 2021]
  list_alpha: [1.0, 2.0]

assess:
  total_corp_regions: 5
  total_zone_regions: 10

maps:
  output_dir: "plots"
  figure_title: "Dengue risk map"

report:
  output_dir: "reports"
  compile_pdf: false

logging:
  level: INFO

storages:
  raw_case:
    kind: filesystem
    filesystem:
      base_path: "./dengue-model-pipeline-automation - GBA/src/dengue-model-pipeline/datasets"

  raw_weather:
    kind: filesystem
    filesystem:
      base_path: "./dengue-model-pipeline-automation - GBA/src/dengue-model-pipeline/datasets/parsednetcdf/zone"

  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts"
