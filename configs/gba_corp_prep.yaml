pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Greater Bengaluru Authority (Corp)"

run:
  run_date: ""

data:
  region_type: "corp"

  prepared_data:
    base_dir: "gba_datasets/prepared_data"

  date_range:
    start: "2022-01-01"

  geojson:
    base_path: "gba_datasets/geojsons/geojsons_GBA"
    source_mode: dashboard
    scope_id: gulb_gba
    refresh: false
    # Wards live under <base>/ward/ or <base>/wards/. The geocoding resolver
    # auto-detects either layout.

  case_download:
    enabled: true
    source_mode: dashboard
    source_path: "gba_datasets/raw_case"
    date_start: "2022-01-01"
    selected_region_id: "gulb_gba"    # dashboard scope for Greater Bengaluru

  case_parse:
    region_types:
      - "corp"
    date_column:
      - "Date Of Onset"
      - "Test Performed Date"
      - "Sample Collected Date"
    # The dashboard's GBA export already attaches a resolved ward ID to every
    # row in the "Region Id" column (e.g. "ward_gba-63") via its own pipeline.
    # Trust it — skip geocoding / spatial join entirely.
    region_id_column: "Region Id"
    filters:
      - column: "Confirmed Diagnosis"
        values: ["Dengue"]

  weather_download:
    enabled: true
    source_mode: dashboard         # was openmeteo — avoids rate limits + daily-fresh via dashboard sync
    scope_id: "gulb_gba"              # dashboard /api/weather/observed spelling for GBA
    parsed_output_path: "gba_datasets/weather"
    temperature_unit: "celsius"
    precipitation_unit: "mm"

logging:
  level: INFO

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/gba_corp_prep"
