pipeline:
  name: dengue
  title: "Dengue intelligence"

run:
  run_date: "2026-03-18"  # YYYY-MM-DD; leave empty ("") to use today's date

data:
  case_download:
    enabled: true
    source_backend: "s3"
    source_path: "s3://dsih-artpark-03-standardised-data/EP0005DS0006-Bengaluru_City_Dengue_Line_List/"
    cache_enabled: true
    cache_dir: "./cache/raw_case"
    cache_strategy: "local_first"
    source_prefix: "ihip/"
    source_paths: []
    dest_relpath: "datasets/raw_case_data"

  case_parse:
    region_types:
      - "zone"
    date_start: "2015-01-01"
    date_end: ""

  case_sufficiency:
    enabled: true
    min_total_rows: 30
    min_distinct_regions: 2
    min_date_span_days: 14
    case_column: "case"
    region_column: ""
    date_column: ""

  weather_download:
    enabled: true
    source_mode: "filesystem"           # "filesystem" (local zip cache) or "cds" (download from Copernicus)
    netcdf_cache_path: "./datasets/netcdf"        # local zip cache dir; if set, filesystem mode parses zips here
    parsed_output_path: "./datasets/parsednetcdf" # parsed CSVs cached here; re-parse skipped if CSV already exists
    # region_bounds: [13.3, 77.3, 12.7, 77.9]  # [N, W, S, E] or omit for auto from geojson
    region_type: "zone"                       # zone, corp, ward
    w_params: ["t2m", "d2m", "tp"]            # NetCDF short variable names for parsing
    threshold_km: 25.0                        # grid-point distance filter from region boundary
    bounds_resolution_deg: 0.1                # auto bounds: snap to this degree grid + padding (~0.25 for ERA5 single-levels)
    start_date: "2015-01-01"                  # inclusive download start (YYYY-MM-DD)
    end_date: "2024-07-01"                    # inclusive download end (YYYY-MM-DD)
    # cds_variables:                          # optional: override CDS API variable names (default: from GBA_CDS_VARIABLES env)
    #   - "2m_temperature"
    #   - "2m_dewpoint_temperature"
    #   - "total_precipitation"

  weather_parse:
    region_type: "zone"
    weather_variables:
      - "2mTemperature"
      - "totalPrecipitation"
      - "2mDewpointTemperature"
    daily_agg:
      - name: "2mTemperature"
        op: "max"
        output_name: "2mTemperature_max"
      - name: "2mTemperature"
        op: "min"
        output_name: "2mTemperature_min"
      - name: "2mTemperature"
        op: "mean"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"

    rolling_n_days: 7
    
    rolling_agg:
      - name: "2mTemperature"
        op: "mean"
      - name: "2mDewpointTemperature"
        op: "mean"
      - name: "totalPrecipitation"
        op: "sum"
    sampling_rate: 7
    # Column rename applied when writing agg_daily / agg_Ndays intermediate files (SOT names)
    intermediate_col_rename:
      "2mTemperature_max": "t2m_max"
      "2mTemperature_min": "t2m_min"
      "2mTemperature": "t2m_mean"
      "2mDewpointTemperature": "d2m_mean"
      "totalPrecipitation": "tp_sum"

cutoff:
  case_min_regions: 2
  weather_min_regions: 5

thresholds:
  region_type: "zone"
  n_weeks: 4
  historical_n_years: 5
  excluded_years: [2020, 2021]
  included_years: []  # optional; non-empty = only use these years for historical thresholds

model:
  spatial_res: "zone"
  data_features:
    - "case"
    - "recordDate"
    - "recordYear"
    - "recordMonth"
    - "ISOWeek"
    - "t2m_mean"
    - "tp_sum"
    - "d2m_mean"
  lag:
    lag_temp: [12]
    lag_rf: [4]
  years_to_exclude: [2020, 2021]
  years_to_include: []  # optional; non-empty = only use these years for model training
  list_alpha: [1.0, 2.0]

assess:
  total_corp_regions: 5
  total_zone_regions: 10

maps:
  output_dir: "plots"
  figure_title: "GBA Dengue Risk Map"

report:
  output_dir: "reports"
  compile_pdf: true
  caption_primary: "GBA corporations"
  caption_secondary: "GBA zones"

report_distribution:
  system_name: "Dengue Early Warning System"
  organization: "ARTPARK, IISc Bengaluru"
  state: "Karnataka"
  region: "Greater Bengaluru Area (GBA)"
  department: "Directorate of Health & Family Welfare, GoK"
  contact_email: ""       # optional: shown in footer
  footer_note: ""         # optional: extra disclaimer line

email:
  enabled: true
  "on": ["success"]
  from: "${SMTP_FROM}"
  to:
    - ashutosh.singhai@artpark.in
  smtp:
    host: "${SMTP_HOST}"
    port: 587
    use_tls: true
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"

schedule:
  cron: "0 6 * * 1"          # Every Monday at 6:00 AM (set TZ=Asia/Kolkata on host)
  timezone: "Asia/Kolkata"   # informational — configure TZ on the host/container
  pipeline: "pipelines.dengue.pipeline:build_pipeline"
  config: "configs/gba_stage1_s3.yaml"
  # Docker-mode extras (only needed when running with --mode docker):
  # image: "dengue-pipeline:latest"
  # env_file: "/app/.env"
  # artifacts_dir: "/app/artifacts"

logging:
  level: INFO

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts"

