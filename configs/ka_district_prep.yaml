pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Karnataka (district)"

run:
  run_date: ""

data:
  region_type: "district"

  prepared_data:
    base_dir: "ka_datasets/prepared_data"

  date_range:
    start: "2022-01-01"

  geojson:
    base_path: "ka_datasets/geojsons"
    source_mode: dashboard          # auto-fetch from dashboard if base_path is empty
    scope_id: karnataka             # or DASHBOARD_SELECTED_REGION_ID env var
    refresh: false                  # true = re-download even if cached

  case_download:
    enabled: true
    source_mode: dashboard
    source_path: "ka_datasets/raw_case"
    date_start: "2022-01-01"
    selected_region_id: "karnataka"

  case_parse:
    region_types:
      - "district"

    date_column:
      - "Date Of Onset"
      - "Test Performed Date"
      - "Sample Collected Date"

    region_id_column: "Region Id"
    lat_column: "Latitude"
    lon_column: "Longitude"

    filters:
      - column: "Test Suspected For"
        values:
          - "Dengue"

  weather_download:
    enabled: true
    source_mode: dashboard           # was filesystem — avoids Open-Meteo rate limits + gets fresh daily data
    scope_id: "karnataka"               # dashboard /api/weather/observed expects this exact spelling
    parsed_output_path: "ka_datasets/weather"
    temperature_unit: "celsius"      # what dashboard returns natively — parser converts to K/m on disk
    precipitation_unit: "mm"

logging:
  level: DEBUG

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/ka_prep"