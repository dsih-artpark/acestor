pipeline:
  name: dengue_prep
  title: "Dengue Data Prep — Karnataka"

run:
  run_date: ""

data:
  region_type: "district"

  prepared_data:
    base_dir: "ka_prepared_data"

  date_range:
    start: "2018-01-01"
    end: ""

  geojson:
    base_path: "ka_datasets/geojsons/geojsons_KA"

  case_download:
    enabled: true
    source_backend: "filesystem"
    source_path: "ka_datasets/linelist"

  case_parse:
    region_types:
      - "district"
    date_column: "metadata.primaryDate"
    lgd_code_column: "location.admin2.ID"
    lat_column: "location.geometry.latitude"
    lon_column: "location.geometry.longitude"
    filters:
      - column: "metadata.diseaseName"
        values: ["Dengue"]

  weather_download:
    enabled: true
    source_mode: "filesystem"
    source_path: "ka_datasets/weather/district"
    temperature_unit: "kelvin"
    precipitation_unit: "m"

logging:
  level: DEBUG

storages:
  artifacts:
    kind: filesystem
    filesystem:
      base_path: "./artifacts/ka_prep"
