services:
  web:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn acestor_web.main:app --host 0.0.0.0 --port 8000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acestor}
      POSTGRES_DB: ${POSTGRES_DB:-acestor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acestor}"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
