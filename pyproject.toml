[project]
name = "acestor"
version = "0.1.0"
description = "Production dengue intelligence pipeline."
readme = "README.md"
license = {text = "GPL-3.0"}
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10",
    "geopandas>=1.1.3",
    "geopy>=2.4",
    "jinja2>=3.1",
    "netcdf4>=1.7.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "pyyaml",
    "tqdm>=4.0",
    "xarray>=2025.6.1",
]

[project.optional-dependencies]
s3 = [
    "boto3",
    "botocore[crt]",
]
api = [
    "fastapi",
]
# Production dengue pipeline (geospatial + modeling)
dengue = [
    "pandas",
    "numpy",
    "statsmodels",
    "scikit-learn",
    "xgboost",
    "optuna",
    "geopandas",
    "matplotlib",
]
cds = [
    "cdsapi",
    "xarray",
    "netcdf4",
]
# TimesFM 2.5 forecasting model (issue #46). Heavy: pulls torch + the model
# checkpoint at first use, and runs in an isolated subprocess to keep torch's
# runtime away from xgboost's OpenMP. Core install stays light without it.
timesfm = [
    "timesfm[torch]==2.0.0",
]
dev = [
    "ruff",
    "black",
    "pre-commit",
    "pytest",
    "pytest-cov",
]

[project.scripts]
acestor-run = "acestor.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=acestor --cov=pipelines/dengue/lib --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
omit = ["*/.venv/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.black]
target-version = ["py310"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
docs = [
    "sphinx-book-theme>=1.1.0",
    "myst-parser>=3.0.0",
    "sphinx>=8.1.3",
    "sphinx-design>=0.6.0",
]
