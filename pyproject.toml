[project]
name = "acestor"
version = "0.1.0"
description = "Production dengue intelligence pipeline."
readme = "README.md"
license = {text = "GPL-3.0"}
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "netcdf4>=1.7.3",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "pyyaml",
    "xarray>=2025.6.1",
]

[project.optional-dependencies]
s3 = [
    "boto3",
    "botocore[crt]",
]
api = [
    "fastapi",
]
# Production dengue pipeline (geospatial + modeling)
dengue = [
    "pandas",
    "numpy",
    "statsmodels",
    "scikit-learn",
    "geopandas",
    "matplotlib",
]
cds = [
    "cdsapi",
    "xarray",
    "netcdf4",
]
dev = [
    "ruff",
    "black",
    "pre-commit",
    "pytest",
]

[project.scripts]
acestor-run = "acestor.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
target-version = ["py310"]
