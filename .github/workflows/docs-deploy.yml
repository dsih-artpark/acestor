name: Deploy Docs

on:
  push:
    tags:
      - "*"

jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    environment:
      name: production_api

    steps:
      - name: Deploy Docs
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            cd /home/ubuntu/acestor
            pwd
            git pull
            uv sync --group docs
            source .venv/bin/activate
            cd site
            make html
