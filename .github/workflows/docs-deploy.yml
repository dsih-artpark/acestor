name: Deploy Docs

on:
  push:
    tags:
      - "*"

jobs:
  deploy_docs:
    runs-on: ubuntu-latest
    environment:
      name: production_api

    steps:
      - name: Deploy Docs
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.IP }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          script: |
            set -euo pipefail
            # Non-interactive SSH shell doesn't source .profile/.bashrc,
            # so ~/.local/bin (where uv installs) isn't on PATH by default.
            export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            command -v uv >/dev/null || { echo "uv not found on PATH ($PATH)"; exit 1; }

            cd /home/ubuntu/acestor
            git pull --ff-only
            uv sync --group docs
            source .venv/bin/activate
            cd site
            make html
