name: Deploy acestor-caller

# Deploys the acestor remote-run scheduler onto the caller EC2 instance
# via AWS SSM SendCommand — no SSH keys anywhere.
#
# Preconditions (set up once via scripts/bootstrap_infra.sh):
#   * OIDC provider + IAM role github-actions-deploy-caller
#   * Caller EC2 running with tag Name=acestor-caller + SSM agent + SSM policy
#
# Required repo Secrets:
#   AWS_DEPLOY_ROLE_ARN, DASHBOARD_URL, DASHBOARD_CLIENT_ID, DASHBOARD_CLIENT_SECRET
# Required repo Variables:
#   AWS_REGION, CALLER_INSTANCE_TAG_NAME
# Optional repo Variables:
#   ACESTOR_AWS_KEY_NAME, ACESTOR_AWS_AMI

on:
  push:
    branches: [production]
    # Broad paths: the caller's ~/acestor-work is rsync'd to every compute
    # spawn, so any pipeline/config change also needs a redeploy to land.
    # Cheaper to over-deploy than to hit "why is my code change not live"
    # confusion — the deploy is idempotent + takes ~60s.
    paths:
      - "scripts/run_schedules_remote.py"
      - "scripts/deploy_caller.sh"
      - ".github/workflows/deploy-caller.yml"
      - "acestor/**"
      - "pipelines/**"
      - "configs/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy on the caller (defaults to production)"
        required: false
        default: "production"

# One deployment at a time — protects the caller from racing SSM invocations.
concurrency:
  group: deploy-caller
  cancel-in-progress: false

# OIDC needs id-token: write. contents: read is the default.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail fast with a friendly message when Secrets/Variables haven't been
      # configured yet — happens the first time this workflow triggers (on
      # merge) before the operator has had a chance to run bootstrap_infra.sh
      # + paste values into repo settings. Without this preflight, the AWS
      # OIDC action fails with an opaque "aws-region required" error.
      - name: Preflight — required Secrets & Variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_CLIENT_ID: ${{ secrets.DASHBOARD_CLIENT_ID }}
          DASHBOARD_CLIENT_SECRET: ${{ secrets.DASHBOARD_CLIENT_SECRET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CALLER_INSTANCE_TAG_NAME: ${{ vars.CALLER_INSTANCE_TAG_NAME }}
        run: |
          missing=()
          for v in AWS_DEPLOY_ROLE_ARN DASHBOARD_URL DASHBOARD_CLIENT_ID \
                   DASHBOARD_CLIENT_SECRET AWS_REGION CALLER_INSTANCE_TAG_NAME; do
            if [[ -z "${!v}" ]]; then
              missing+=("$v")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing required GitHub Secrets/Variables: ${missing[*]}"
            echo ""
            echo "This workflow needs the AWS + dashboard config to have been set up."
            echo "First-time setup: run scripts/bootstrap_infra.sh locally, then paste"
            echo "the printed Secrets/Variables into repo Settings → Secrets and variables → Actions."
            echo "Full runbook: docs/CALLER_DEPLOYMENT.md"
            exit 1
          fi
          echo "All required Secrets/Variables present."

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-caller-${{ github.run_id }}

      - name: Verify identity
        run: aws sts get-caller-identity

      - name: Run deploy_caller.sh (SSM SendCommand → caller)
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          CALLER_INSTANCE_TAG_NAME: ${{ vars.CALLER_INSTANCE_TAG_NAME }}
          ACESTOR_REPO_URL: https://github.com/${{ github.repository }}.git
          ACESTOR_REPO_REF: ${{ inputs.ref || 'production' }}
          ACESTOR_AWS_KEY_NAME: ${{ vars.ACESTOR_AWS_KEY_NAME }}
          ACESTOR_AWS_AMI: ${{ vars.ACESTOR_AWS_AMI }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          DASHBOARD_CLIENT_ID: ${{ secrets.DASHBOARD_CLIENT_ID }}
          DASHBOARD_CLIENT_SECRET: ${{ secrets.DASHBOARD_CLIENT_SECRET }}
        run: bash scripts/deploy_caller.sh
